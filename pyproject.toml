[project]
name = "parrot"
version = "4.0.0"
description = "Discord Markov bot that can imitate everyone individually"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "asyncio-atexit>=1.0.1",
    "discord-py>=2.7.1",
    "jishaku>=2.7.5",
    "markovify>=0.9.4",
    "pillow>=12.3.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "ujson>=5.13.0",
]

[dependency-groups]
dev = ["ruff>=0.15.20"]
migrations = ["pytz>=2024.2", "tqdm>=4.67.1"]
